[package]
name = "videofile-pro"
version = "0.1.0"
description = "VideoFile Pro"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["full"] }
zip = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
regex = "1"
dirs = "5"
futures-util = "0.3"
axum = "0.7"
image = "0.25"
ssimulacra2 = "0.5"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native"] }
ndarray = "0.16"
iqa = { version = "1.2", default-features = false, features = ["ssim", "ms-ssim", "dssim", "butteraugli", "ciede2000", "psnr", "iw-ssim", "psnr-hvs-m", "vendored-lcms2"] }
oximedia-quality = "0.2"
oximedia-core = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]